name: REACH Scout direct DOI metadata checkpoint
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/scout-doi-metadata-checkpoint.yml'
      - 'scout-operations/tools/audit_doi_metadata.py'
      - 'scout-operations/tests/test_crossref_metadata_checkpoint.py'
      - 'scout-discoveries/manifest.json'
      - 'api-discoveries/historical/manifest.json'
      - 'api-discoveries/manifest.json'
      - 'scout-operations/metadata-review-units.json'
      - 'scout-operations/metadata-blockers.json'
  schedule:
    # Periodic revisit for newly enriched repository metadata.
    - cron: '38 14 * * 1'
permissions:
  contents: write
concurrency:
  group: reach-scout-direct-doi-metadata-main
  cancel-in-progress: false
jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out original public evidence
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check all input manifests, SHA-256 and CSV row counts
        run: |
          set -euo pipefail
          python3 scout-operations/tools/audit_doi_metadata.py --offline
          python3 -m unittest discover -s scout-operations/tests -p "test_crossref_metadata_checkpoint.py" -v
      - name: Enrich all candidate DOIs directly via DataCite / Crossref
        run: |
          set -euo pipefail
          python3 scout-operations/tools/audit_doi_metadata.py --workers 6
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('scout-operations/reports/doi-metadata-checkpoint/latest.json')
          x=json.loads(p.read_text(encoding='utf8'))
          assert x['sources']['historical']['rows']==188
          assert x['sources']['staged']['rows']>0
          assert x['successful_lookups']>0
          assert len(x['records'])==x['unique_dois']
          assert len({r['doi'] for r in x['records']})==len(x['records'])
          assert any(r['doi']=='10.7910/dvn/jwzewf' for r in x['records'])
          cr=Path('scout-operations/reports/crossref-metadata-checkpoint/latest.json')
          assert cr.exists(), 'Crossref publication report missing'
          y=json.loads(cr.read_text(encoding='utf8'))
          assert y['counts']['crossref_publications']>=30, 'Crossref publication coverage unexpectedly low'
          assert y['counts']['api_full_pub_date']>0, 'No Crossref published-online or other full publication dates recovered'
          assert len(y['records'])==y['counts']['crossref_publications']
          assert all(r['doi'] and r['evidence'] and r['source']=='crossref' for r in y['records'])
          print('DOI checkpoint summary:',json.dumps({k:v for k,v in x.items() if k!='records'}))
          PY
      - name: Upload source-verified checkpoint report
        uses: actions/upload-artifact@v4
        with:
          name: scout-doi-metadata-checkpoint
          path: |
            scout-operations/reports/doi-metadata-checkpoint/README.md
            scout-operations/reports/doi-metadata-checkpoint/latest.json
            scout-operations/reports/crossref-metadata-checkpoint/README.md
            scout-operations/reports/crossref-metadata-checkpoint/latest.json
          if-no-files-found: error
          retention-days: 90
      - name: Commit only read-only audit output to main
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- scout-operations/reports/doi-metadata-checkpoint/README.md scout-operations/reports/doi-metadata-checkpoint/latest.json scout-operations/reports/crossref-metadata-checkpoint/README.md scout-operations/reports/crossref-metadata-checkpoint/latest.json
          if git diff --cached --quiet; then
            echo 'No changes in DOI metadata audit.'
            exit 0
          fi
          git commit -m 'Refresh source-verified Scout DOI metadata checkpoint audit'
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo 'DOI checkpoint audit published successfully'
              exit 0
            fi
            git fetch origin main
            git rebase origin/main
            sleep "$((attempt * 2))"
          done
          exit 1
