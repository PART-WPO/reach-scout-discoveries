name: REACH historical Crossref backfill (primary SPARK awards)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'api-discoveries/jobs/historical-crossref-2026-11-02.trigger'
permissions:
  contents: write
concurrency:
  group: reach-historical-crossref-backfill
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    strategy:
      fail-fast: false
      matrix:
        shard: [0,1,2,3,4,5,6,7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Crossref client
        run: python -m pip install --disable-pip-version-check requests
      - name: Harvest all-year Crossref works by full primary SPARK award
        run: |
          set -euo pipefail
          python api-discoveries/tools/historical_crossref.py scan --shard ${{ matrix.shard }} --shards 8 --output api-discoveries/tmp
      - name: Preserve each shard and its failure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crossref-historical-shard-${{ matrix.shard }}
          path: api-discoveries/tmp/historical-crossref-shard*.json
          retention-days: 14
          if-no-files-found: warn
  publish:
    needs: scan
    if: needs.scan.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          pattern: crossref-historical-shard-*
          path: api-discoveries/tmp
          merge-multiple: true
      - name: Verify all eight shards; publish immutable historical Crossref research inputs
        run: |
          set -euo pipefail
          python3 api-discoveries/tools/historical_crossref.py publish --shards 8 --run-id ${{ github.run_id }} --output api-discoveries/tmp
          python3 scout-operations/tools/reconcile_historical_crossref.py
          python3 scout-operations/tools/select_workstream.py
      - name: Commit public-only Crossref backlog, checkpoints, and routing
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- api-discoveries/historical-crossref api-discoveries/runs scout-operations/historical-crossref-triage.json scout-operations/historical-crossref-coverage.json scout-operations/active-workstream.json
          if git diff --cached --quiet; then
            echo 'Crossref backlog already published (idempotent)'
            exit 0
          fi
          git commit -m 'Publish validated historical Crossref seed backlog and route Scout research'
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo 'Historical Crossref backlog committed to main'
              exit 0
            fi
            git fetch origin main
            git rebase origin/main
            sleep "$((attempt * 2))"
          done
          echo 'Unable to push Crossref queue; check workflow logs' >&2
          exit 1
