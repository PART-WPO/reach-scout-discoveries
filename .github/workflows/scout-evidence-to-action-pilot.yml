name: Scout evidence-to-action pilot (read-only)
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scout-operations/tools/evidence_to_action_pilot.py'
      - 'scout-operations/tests/test_evidence_to_action_pilot.py'
      - 'scout-operations/research-outcome-registry.json'
      - 'scout-operations/research-decision-cases.json'
      - 'scout-operations/historical-crossref-phase2/**'
      - 'scout-operations/monthly-research/**'
      - '.github/workflows/scout-evidence-to-action-pilot.yml'
jobs:
  evidence-to-action:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run conservative decision-safety tests
        run: python -m unittest discover -s scout-operations/tests -p 'test_evidence_to_action_pilot.py' -v
      - name: Evaluate all registry cases against SHA-pinned evidence
        run: |
          python scout-operations/tools/evidence_to_action_pilot.py
          python scout-operations/tools/evidence_to_action_pilot.py --check
      - name: Publish read-only pilot results as a downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: scout-evidence-to-action-pilot
          path: scout-operations/reports/evidence-to-action-pilot.json
          retention-days: 30
