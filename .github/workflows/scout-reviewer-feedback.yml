name: Enforce private Discovery Hub reviewer-feedback boundary
on:
  pull_request:
    paths:
      - 'scout-operations/tools/validate_reviewer_feedback.py'
      - 'scout-operations/tests/test_validate_reviewer_feedback.py'
      - 'scout-operations/research-feedback.json'
      - 'scout-operations/reviewer-feedback-inbox/**'
      - 'integrations/DiscoveryHubFeedbackInstall.md'
      - 'integrations/DiscoveryHubScoutFeedback.gs'
      - '.github/workflows/scout-reviewer-feedback.yml'
  push:
    branches: [main]
    paths:
      - 'scout-operations/reviewer-feedback-inbox/**'
      - 'scout-operations/research-feedback.json'
      - 'scout-operations/tools/validate_reviewer_feedback.py'
      - 'integrations/DiscoveryHubScoutFeedback.gs'
      - '.github/workflows/scout-reviewer-feedback.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  privacy-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify disabled private exporter syntax
        run: |
          cp integrations/DiscoveryHubScoutFeedback.gs /tmp/ScoutFeedbackExporter.js
          node --check /tmp/ScoutFeedbackExporter.js
      - name: Test signed feedback validator and privacy holds
        run: |
          python -m unittest discover -v -s scout-operations/tests -p 'test_validate_reviewer_feedback.py'
      - name: Fail if private decisions appear in public Scout sources
        run: |
          PYTHONPATH=scout-operations/tools python - <<'PY'
          from validate_reviewer_feedback import run
          state=run()
          assert state['signals']==[], "Public reviewer event(s) must not be stored"
          assert state['events_held_for_manual_identity_reconciliation']==[], "Private decision identity hold cannot be public"
          assert state['private_hub_connection_status']=='NOT_CONNECTED_OR_NOT_EXPORTED'
          print("Privacy hold verified: no private reviewer decisions published")
          PY
