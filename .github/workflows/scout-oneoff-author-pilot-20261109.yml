name: One-time Scout public-REACH author pilot 2026-11-09
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/scout-oneoff-author-pilot-20261109.yml'
permissions:
  contents: read
concurrency:
  group: oneoff-public-reach-author-na22oar4590515
  cancel-in-progress: false
jobs:
  single-readonly-award-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout current source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate REACH-only author and identity gates
        run: |
          set -euo pipefail
          python -m unittest discover -s scout-operations/tests -p 'test_reach_author_pilot.py' -v
          python -m unittest discover -s scout-operations/tests -p 'test_identity_disposition.py' -v
      - name: Verify live public REACH source fingerprint
        run: |
          python - <<'PY'
          import hashlib,json,urllib.request
          from pathlib import Path
          cache=json.loads(Path('scout-operations/reach-comparison-cache/comparison-index.json').read_text())
          url='https://raw.githubusercontent.com/PART-WPO/reach-dashboard/main/agent-data/manifest.json'
          with urllib.request.urlopen(url,timeout=35) as response:
              live=hashlib.sha256(response.read()).hexdigest()
          if live != cache['source_manifest_sha256']:
              raise SystemExit('STALE PUBLIC REACH CACHE: pilot stopped rather than use unverified sources')
          print('SHA-256 public REACH manifest verified')
          PY
      - name: One-time bounded award-based author discovery
        run: |
          set -euo pipefail
          python scout-operations/tools/reach_author_pilot.py \
            --award NA22OAR4590515 \
            --output "$RUNNER_TEMP/scout-na22oar4590515-doi-only.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          report=json.loads((Path(os.environ["RUNNER_TEMP"])/"scout-na22oar4590515-doi-only.json").read_text())
          assert report['award']=='NA22OAR4590515'
          assert report['spark_author_data_accessed'] is False
          assert report['human_review_or_reach_modified'] is False
          assert all(not e['project_funding_verified'] and not e['discovery_hub_eligible'] for e in report['independent_doi_leads'])
          assert all('author' not in field.lower() for e in report['independent_doi_leads'] for field in e)
          print(json.dumps({"public_seeds":report["potential_seed_dois"],
                            "crossref_verified_journal_seed_count":report["verified_publications"],
                            "transient_author_count":report["transient_authors_used"],
                            "doi_only_lead_count":len(report["independent_doi_leads"]),
                            "no_private_or_public_mutation":True},sort_keys=True))
          PY
      - name: Upload DOI-only results for review, not Discovery Hub
        uses: actions/upload-artifact@v4
        with:
          name: pilot-na22oar4590515-doi-only
          path: ${{ runner.temp }}/scout-na22oar4590515-doi-only.json
          retention-days: 2
          if-no-files-found: error
