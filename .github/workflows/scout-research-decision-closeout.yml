name: Scout evidence-to-decision closeout
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/scout-research-decision-closeout.yml'
      - 'scout-operations/tools/reconcile_derived_reporting.py'
      - 'scout-operations/tests/test_reconcile_derived_reporting.py'
      - 'scout-operations/tests/test_structured_evidence_extraction.py'
  push:
    branches: [main]
    paths:
      - 'scout-operations/historical-crossref-phase2/*.json'
      - 'scout-operations/tools/compile_research_evidence.py'
      - 'scout-operations/tools/summarize_research_decisions.py'
      - 'scout-operations/tools/build_operational_scorecard.py'
      - 'scout-operations/tools/build_expansion_relevance.py'
      - 'scout-operations/expansion-scope-reconsiderations.json'
      - 'scout-operations/tools/reconcile_historical.py'
      - 'scout-operations/tools/reconcile_historical_crossref.py'
      - 'scout-operations/tools/reconcile_derived_reporting.py'
      - 'scout-discoveries/manifest.json'
      - '.github/workflows/scout-research-decision-closeout.yml'
  # GitHub Actions bot commits don't reliably create downstream push events.
  # workflow_run is the post-publication reconciliation boundary.
  workflow_run:
    workflows:
      - 'Validate and Publish Scout Discovery Feed'
      - 'Build verified REACH comparison cache'
      - 'Historical Crossref actionable routing'
      - 'Scout all-lane research outcome registry'
      - 'Scout recover DOI metadata after research access failures'
      - 'Scout Crossref indexed-updates and SPARK project leads'
      - 'Scout bounded human project referrals'
    types: [completed]
    branches: [main]
permissions:
  contents: write
concurrency:
  group: scout-evidence-decision-closeout
  cancel-in-progress: false
jobs:
  evaluate:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate safe reconciliation behavior without requiring an already-current cache
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check requests
          python -m py_compile scout-operations/tools/reconcile_derived_reporting.py
          python -m unittest discover -v -s scout-operations/tests -p 'test_reconcile_derived_reporting.py'
          python -m unittest discover -v -s scout-operations/tests -p 'test_decision_pipeline.py'
      - name: Rebuild and verify all reports in a PR workspace (no publish)
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          python scout-operations/tools/reconcile_derived_reporting.py
          python -m unittest discover -v -s scout-operations/tests
          python scout-operations/tools/reconcile_derived_reporting.py
          python - <<'PY'
          import subprocess,sys
          sys.path.insert(0,'scout-operations/tools')
          from reconcile_derived_reporting import DERIVED_FILES
          changed=subprocess.check_output(['git','diff','--name-only'],text=True).splitlines()
          allowed=set(DERIVED_FILES)
          unexpected=[p for p in changed if p not in allowed]
          if unexpected:
              raise SystemExit('PR reconciliation unexpectedly modified source: '+', '.join(unexpected))
          print('PR source mutation guard verified:',len(changed),'authorized derived file(s)')
          PY
      - name: Reconcile from a fresh main snapshot and commit only verified derived files
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5; do
            echo "Reconcile exact live main source snapshot; attempt $attempt/5"
            git fetch origin main
            git checkout -B main origin/main
            python - <<'PY'
          import hashlib, json, urllib.request
          from pathlib import Path
          cache=json.loads(Path("scout-operations/reach-comparison-cache/comparison-index.json").read_text())
          url="https://raw.githubusercontent.com/PART-WPO/reach-dashboard/main/agent-data/manifest.json"
          with urllib.request.urlopen(url,timeout=45) as response:
              live=response.read()
          if hashlib.sha256(live).hexdigest()!=cache["source_manifest_sha256"]:
              raise SystemExit("STOP: Live REACH manifest changed; refresh the verified comparison cache first")
          PY
            python scout-operations/tools/reconcile_derived_reporting.py
            python -m unittest discover -v -s scout-operations/tests
            python - <<'PY'
          import subprocess,sys
          sys.path.insert(0,"scout-operations/tools")
          from reconcile_derived_reporting import DERIVED_FILES
          allowed=set(DERIVED_FILES)
          changed=subprocess.check_output(["git","diff","--name-only"],text=True).splitlines()
          unexpected=[p for p in changed if p not in allowed]
          untracked=subprocess.check_output(["git","ls-files","--others","--exclude-standard"],text=True).splitlines()
          unexpected.extend(p for p in untracked
                            if not ((p.startswith("scout-operations/case-checkpoints/") and p.endswith(".json"))
                                    or ("/__pycache__/" in p and p.endswith(".pyc"))))
          if unexpected:
              raise SystemExit("STOP: Unexpected source or protected file modification: "+", ".join(unexpected))
          print("Changed files confined to authorized derived reports and immutable checkpoints")
          PY
            git add -- scout-operations/historical-coverage.json \
              scout-operations/historical-crossref-coverage.json \
              scout-operations/historical-reconciliation-exceptions.json \
              scout-operations/historical-crossref-reconciliation-exceptions.json \
              scout-operations/identity-cache/public-identity-index.json \
              scout-operations/research-decision-cases.json \
              scout-operations/research-evidence-coverage.json \
              scout-operations/research-decision-rollup.json \
              scout-operations/expansion-relevance-priority.json \
              scout-operations/active-workstream.json \
              scout-operations/unified-source-preflight.json \
              scout-operations/research-feedback.json \
              scout-operations/scout-operational-scorecard.json \
              scout-operations/scout-v2-impact-report.json \
              scout-operations/scout-v2-benchmark-100.json \
              scout-operations/case-checkpoints
            if git diff --cached --quiet; then
              echo "Source-pinned derived reports are already synchronized"
              exit 0
            fi
            git commit -m 'Reconcile SHA-pinned Scout decision index and stage reports (#35)'
            if git push origin HEAD:main; then
              echo "Published validated source-consistent Scout reports"
              exit 0
            fi
            echo "Concurrent main update; restart from fresh source and rebuild, never copy stale output"
            sleep "$((attempt * 2))"
          done
          echo "::error::Unable to publish after five clean source rebuild attempts"
          exit 1
      - name: Attach derived data diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scout-ordered-derived-reconciliation
          path: |
            scout-operations/research-decision-rollup.json
            scout-operations/scout-operational-scorecard.json
            scout-operations/scout-v2-impact-report.json
          if-no-files-found: warn
