name: DataCite date reconciliation - historical and monthly
on:
  workflow_dispatch:
  schedule:
    # Weekly audit of changed public DOI metadata; plus the first-of-month intake.
    - cron: '49 13 * * 1'
    - cron: '15 16 1 * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/datacite-date-reconciliation.yml'
      - 'api-discoveries/tools/reconcile_datacite_dates.py'
      - 'api-discoveries/tests/test_reconcile_datacite_dates.py'
      - 'api-discoveries/historical/manifest.json'
      - 'api-discoveries/manifest.json'

permissions:
  contents: write

concurrency:
  group: reach-datacite-date-reconciliation
  cancel-in-progress: false

jobs:
  date-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate date classification and the original source checksums
        run: |
          set -euo pipefail
          python3 -m unittest discover -s api-discoveries/tests -p 'test_reconcile_datacite_dates.py' -v

      - name: Read-only historical DataCite date audit
        run: |
          set -euo pipefail
          python3 api-discoveries/tools/reconcile_datacite_dates.py --mode historical
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('api-discoveries/date-audits/historical-2026-10-28.json')
          x=json.loads(p.read_text())
          assert x['original_dois']==188, 'Historical input count changed: investigate before publishing'
          statuses=x['status_counts']
          assert statuses.get('api_unavailable',0)<188, 'All DataCite queries failed: do not publish an empty audit'
          assert len(x['records'])==188
          assert all(r['original_title'] and r['award_numbers'] for r in x['records'])
          print('Historical date audit validated; dates remain evidence only.',statuses)
          PY

      - name: Read-only date audit of all completed monthly DataCite intakes
        run: |
          set -euo pipefail
          shopt -s nullglob
          for run in api-discoveries/runs/monthly-*.json; do
            month="$(basename "$run" .json | sed 's/^monthly-//')"
            if [[ "$month" =~ ^20[0-9]{2}-(0[1-9]|1[0-2])$ ]]; then
              python3 api-discoveries/tools/reconcile_datacite_dates.py --mode monthly --month "$month"
            fi
          done

      - name: Upload spreadsheet and machine-readable audit
        uses: actions/upload-artifact@v4
        with:
          name: reach-datacite-date-reconciliation
          path: |
            api-discoveries/reports/REACH_DataCite_Date_Reconciliation_*.xlsx
            api-discoveries/date-audits/*.json
          retention-days: 90
          if-no-files-found: error

      - name: Publish only replaceable audit snapshots and workbooks
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- api-discoveries/date-audits api-discoveries/reports/REACH_DataCite_Date_Reconciliation_*.xlsx
          if git diff --cached --quiet; then
            echo 'Date-audit snapshots already current.'
            exit 0
          fi
          git commit -m 'Refresh read-only DataCite historical and monthly publication-date evidence audits'
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo "Published read-only date-audit evidence on attempt $attempt."
              exit 0
            fi
            git fetch origin main
            git rebase origin/main
            sleep "$((attempt * 2))"
          done
          echo 'Unable to publish after retries. Inspect git conflicts before trying again.' >&2
          exit 1
