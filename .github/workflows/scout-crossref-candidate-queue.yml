name: Scout Crossref candidate queue refresh
on:
  pull_request:
    paths:
      - 'scout-operations/tools/build_candidate_queue.py'
      - 'scout-operations/tests/test_candidate_queue.py'
      - '.github/workflows/scout-crossref-candidate-queue.yml'
  push:
    branches: [main]
    paths:
      - 'scout-operations/tools/build_candidate_queue.py'
      - 'scout-operations/tests/test_candidate_queue.py'
      - 'scout-operations/historical-crossref-screening/actionable-routing.json'
      - 'scout-operations/research-outcome-registry.json'
      - 'scout-operations/decision-handoff-ledger.json'
      - 'scout-discoveries/manifest.json'
      - 'scout-discoveries/batches/**'
      - 'scout-operations/historical-crossref-phase2/**'
      - 'scout-operations/preprint-watchlist.json'
      - 'scout-operations/preprint-retirement-archive.json'
      - 'api-discoveries/historical-crossref/manifest.json'
      - 'api-discoveries/historical-crossref/batches/**'
      - '.github/workflows/scout-crossref-candidate-queue.yml'
  # GitHub Actions bot commits do not reliably trigger push workflows.
  # Refresh from the completed source-ordered reconciliation boundary.
  workflow_run:
    workflows:
      - 'Scout evidence-to-decision closeout'
    types: [completed]
    branches: [main]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: scout-crossref-candidate-queue
  cancel-in-progress: false
jobs:
  refresh:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test deterministic queue and funding signals
        run: |
          python -m py_compile scout-operations/tools/build_candidate_queue.py
          python -m unittest discover -v -s scout-operations/tests -p 'test_candidate_queue.py'
      - name: Refresh queue against latest main with conflict retries
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4; do
            git fetch origin main
            git checkout -B main origin/main
            python scout-operations/tools/build_candidate_queue.py
            python scout-operations/tools/build_candidate_queue.py --check
            python - <<'PY'
          import json
          from pathlib import Path
          q=json.loads(Path("scout-operations/crossref-candidate-queue.json").read_text())
          routing=json.loads(Path("scout-operations/historical-crossref-screening/actionable-routing.json").read_text())
          by_doi={x["doi"]:x for x in q["items"]}
          for doi in ("10.1175/aies-d-26-0004.1","10.1029/2026jd046327"):
              route=next(x for x in routing["entries"] if x["doi"]==doi)
              if any({"exact_doi","normalized_title"}.issubset(set(m["basis"]))
                     and m["source"].startswith("SCOUT_") for m in route["scout_public_queue_matches"]):
                  assert by_doi[doi]["lane"]=="ALREADY_IN_SCOUT_REVIEW_FAST_EXIT",doi
                  assert by_doi[doi]["one_mission_disposition_required"] is False,doi
          assert "10.1029/2026jd046327" not in [
              x["doi"] for x in q["next_one_mission_original_preview"]]
          print("Source-current public Scout handoff fast exits verified; no duplicate original mission")
          PY
            git add scout-operations/crossref-candidate-queue.json
            if git diff --cached --quiet; then
              echo "Queue already current"
              exit 0
            fi
            git commit -m 'Refresh SHA-pinned Crossref candidate queue'
            if git push origin HEAD:main; then exit 0; fi
            sleep "$((attempt * 2))"
          done
          exit 1
