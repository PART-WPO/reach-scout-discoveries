name: Historical Crossref actionable routing
on:
  workflow_dispatch:
  schedule:
    # Refresh SHA-derived REACH/NOAA IR/project relevance and workstream
    # before the 11:45 UTC verified-impact run and weekday 8 AM ET briefing.
    - cron: '20 11 * * 1-5'
  push:
    branches: [main]
    paths:
      - '.github/workflows/historical-crossref-actionable-routing.yml'
      - 'scout-operations/historical-crossref-screening/build_actionable_routing.py'
      - 'scout-operations/tests/test_historical_crossref_title_normalization.py'
      - 'scout-operations/tests/test_bulk_reach_dedup.py'
      - 'scout-operations/tools/bulk_reach_dedup.py'
      - 'scout-operations/tools/build_expansion_relevance.py'
      - 'scout-operations/expansion-scope-reconsiderations.json'
      - 'scout-operations/monthly-expansion-leads.json'
      - 'scout-operations/independent-discovery-leads.json'
      - 'scout-operations/tools/decision_pipeline.py'
      - 'scout-operations/historical-crossref-screening/manifest.json'
      - 'scout-operations/reach-comparison-cache/comparison-index.json'
permissions:
  contents: write
concurrency:
  group: historical-crossref-actionable-routing
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate current public REACH manifest and regenerate routing
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            echo "Routing attempt ${attempt}/5"
            git fetch origin main
            git checkout -B main origin/main
            python - <<'PY'
          import hashlib,json,urllib.request
          from pathlib import Path
          p=Path("scout-operations/reach-comparison-cache/comparison-index.json")
          cache=json.loads(p.read_text())
          url="https://raw.githubusercontent.com/PART-WPO/reach-dashboard/main/agent-data/manifest.json"
          with urllib.request.urlopen(url,timeout=45) as response:
              live=response.read()
          digest=hashlib.sha256(live).hexdigest()
          if digest!=cache["source_manifest_sha256"]:
              raise SystemExit("STALE REACH CACHE: public source manifest differs; refresh cache workflow before routing")
          print("Verified live REACH manifest SHA-256:",digest)
          PY
            python -m unittest discover -s scout-operations/tests -p 'test_historical_crossref_title_normalization.py' -v
            python -m unittest discover -s scout-operations/tests -p 'test_bulk_reach_dedup.py' -v
            python -m unittest discover -s scout-operations/tests -p 'test_select_workstream.py' -v
            python -m unittest discover -s scout-operations/tests -p 'test_expansion_relevance.py' -v
            python scout-operations/historical-crossref-screening/build_actionable_routing.py
            python scout-operations/tools/build_expansion_relevance.py
            python scout-operations/tools/build_operational_scorecard.py
            python scout-operations/tools/select_workstream.py
            python - <<'PY'
          import json
          from pathlib import Path
          p=Path("scout-operations/historical-crossref-screening/actionable-routing.json")
          j=json.loads(p.read_text())
          assert j["total"]==614, "Unexpected source count; investigate source change"
          assert sum(j["counts"].values())==j["total"]
          assert len(j["entries"])==j["total"]
          assert len({r["doi"] for r in j["entries"]})==j["total"]
          # These were missed solely because Crossref titles contained XML tags.
          expected = {
              "10.1002/hyp.14960": "reachuid-v1-f72e7a1bbe84c9357563896ed8e7a6fb",
              "10.1111/jfr3.12795": "reachuid-v1-7d17c0204a013a38d0680366b003c0ed",
              "10.1111/jfr3.70241": "reachuid-v1-0b4005a95b19d0b6682bc9fe8c89c564",
              "10.5194/gmd-17-5309-2024": "reachuid-v1-95976a19f5118fe6c9a1c968bb941460"
          }
          index={e["doi"]:e for e in j["entries"]}
          for doi,uid in expected.items():
              row=index[doi]
              # Each has official IR DOI -> unique canonical URL -> REACH UID
              # plus independently consistent normalized title evidence.
              assert row["outcome"]=="CONFIRMED_IN_REACH",(doi,row["outcome"])
              assert row["bulk_identity_gate"]["status"]=="VERIFIED_EXISTING_REACH"
              assert row["bulk_identity_gate"]["verified_reach_uid"]==uid
              assert row["bulk_identity_gate"]["basis"]=="VERIFIED_NOAA_IR_DOI_TO_REACH_URL_AND_TITLE"
              assert any(m["reach_uid"]==uid and m["title_hit"] and m["official_ir_url_hit"]
                         for m in row["matches"]),(doi,row["matches"])
          assert j["bulk_identity_screening"]["counts"]["VERIFIED_EXISTING_REACH"]>=300
          assert all(r["original_triage_modified"] is False and r["expansion_seed_preserved"] is True
                     and r["private_hub_review_verified"] is False for r in j["entries"])
          print("Verified four source-backed URL duplicates; original ledgers and expansion seeds untouched")
          score=json.loads(Path("scout-operations/scout-operational-scorecard.json").read_text())
          assert score["reach_screening"]["confirmed_reach"]==j["counts"]["CONFIRMED_IN_REACH"]
          assert score["reach_screening"]["likely_reach_needs_bounded_check"]==j["counts"]["LIKELY_IN_REACH"]
          assert score["reach_screening"]["not_found_in_index_needs_research"]==j["counts"]["NOT_FOUND_IN_REACH_INDEX"]
          assert score["separate_doi_expansion"]["historical_crossref_completed_verified"]==0
          workstream=json.loads(Path("scout-operations/active-workstream.json").read_text())
          assert workstream["historical_crossref_api"]["identity_screening_complete"] is True
          assert workstream["historical_crossref_api"]["originals_pending_first_pass"]==0
          assert workstream["historical_crossref_api"]["identity_verified_existing_reach"]==j["counts"]["CONFIRMED_IN_REACH"]
          assert workstream["historical_crossref_api"]["identity_needs_bounded_review"]==j["counts"]["LIKELY_IN_REACH"]
          relevance=json.loads(Path("scout-operations/expansion-relevance-priority.json").read_text())
          rc=relevance["historical_crossref"]["counts"]
          assert sum(rc.values())==j["total"]
          assert rc["PRIORITIZE_VERIFIED_WPO_SEED"]==j["counts"]["CONFIRMED_IN_REACH"]
          assert workstream["historical_crossref_api"]["seed_relevance_priority_counts"]==rc
          assert score["separate_doi_expansion"]["relevance_priority_counts"]==rc
          assert relevance["seed_expansion_closures"]==0
          print("Validated routing:",j["counts"],"scope priorities:",rc)
          PY
            git add scout-operations/historical-crossref-screening/actionable-routing.json scout-operations/expansion-relevance-priority.json scout-operations/scout-operational-scorecard.json scout-operations/active-workstream.json
            if git diff --cached --quiet; then
              echo "Routing already current"
              exit 0
            fi
            git commit -m "Regenerate checksum-verified historical Crossref actionable routing"
            if git push origin HEAD:main; then
              echo "Published routing at $(git rev-parse --short HEAD)"
              exit 0
            fi
            echo "Concurrent update; revalidating and rebuilding against latest main"
            sleep $((attempt * 2))
          done
          echo "::error::Unable to publish routing after five attempts"
          exit 1
