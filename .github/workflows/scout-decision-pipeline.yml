name: Scout decision pipeline validation
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/scout-decision-pipeline.yml'
      - 'scout-operations/tools/decision_pipeline.py'
      - 'scout-operations/tests/test_decision_pipeline.py'
      - 'scout-operations/tests/published-crossref-decision-cases.json'
      - 'scout-operations/tests/flash-drought-positive-control-case.json'
      - 'scout-operations/decision-contract-v1.md'
      - 'scout-discoveries/manifest.json'
      - 'scout-discoveries/inbox/**'
      - 'scout-operations/reach-comparison-cache/comparison-index.json'
permissions:
  contents: write
concurrency:
  group: scout-decision-pipeline
  cancel-in-progress: false
jobs:
  regression-and-checkpoints:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run deterministic regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s scout-operations/tests -p 'test_decision_pipeline.py' -v
          python -m unittest discover -s scout-operations/tests -p 'test_quick_monthly_intake.py' -v
      - name: Verify live REACH snapshot and publish derived, immutable checkpoints
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            echo "Verified decision run attempt ${attempt}/5"
            git fetch origin main
            git checkout -B main origin/main
            python - <<'PY'
          import hashlib, json, urllib.request
          from pathlib import Path
          p = Path("scout-operations/reach-comparison-cache/comparison-index.json")
          cache = json.loads(p.read_text())
          url = "https://raw.githubusercontent.com/PART-WPO/reach-dashboard/main/agent-data/manifest.json"
          with urllib.request.urlopen(url, timeout=45) as response:
              live = response.read()
          digest = hashlib.sha256(live).hexdigest()
          if digest != cache["source_manifest_sha256"]:
              raise SystemExit("STALE REACH SNAPSHOT: Refresh verified comparison cache first")
          print("Verified live REACH source manifest", digest)
          PY
            python scout-operations/tools/decision_pipeline.py build-index
            python scout-operations/tools/decision_pipeline.py evaluate --cases scout-operations/tests/published-crossref-decision-cases.json
            python scout-operations/tools/decision_pipeline.py evaluate --cases scout-operations/tests/flash-drought-positive-control-case.json
            python - <<'PY'
          import glob, json
          from pathlib import Path
          idx=json.loads(Path("scout-operations/identity-cache/public-identity-index.json").read_text())
          assert idx["schema"]=="reach-scout-identity-index-v1"
          assert idx["sources"]["scout_batches"]>=30
          assert len(idx["records"])>=1238
          negatives=json.loads(Path("scout-operations/tests/published-crossref-decision-cases.json").read_text())["cases"]
          positives=json.loads(Path("scout-operations/tests/flash-drought-positive-control-case.json").read_text())["cases"]
          ids={v["doi"] for v in negatives+positives}
          records=[]
          for path in glob.glob("scout-operations/case-checkpoints/doi-*/rev-*.json"):
              x=json.loads(Path(path).read_text())
              if x["case_input"]["doi"] in ids and x["index_fingerprint"]==idx["source_fingerprint"]:
                  records.append(x)
          assert len(records)==4, "Expected three hold controls plus one positive-control checkpoint"
          held=[x for x in records if x["evaluation"]["doi"] in {v["doi"] for v in negatives}]
          ready=[x for x in records if x["evaluation"]["doi"] in {v["doi"] for v in positives}]
          assert len(held)==3 and len(ready)==1
          assert not any(x["evaluation"]["decision"]=="READY_FOR_VALIDATED_DRAFT_PREFLIGHT" for x in held)
          assert ready[0]["evaluation"]["decision"]=="READY_FOR_VALIDATED_DRAFT_PREFLIGHT"
          assert ready[0]["evaluation"]["identity_check"]["status"]=="NO_PUBLIC_IDENTITY_MATCH"
          assert ready[0]["evaluation"]["review_action"]=="HUMAN_REVIEW_PROPOSAL"
          assert all(not x["evaluation"]["automatically_staged"] for x in records)
          assert all(x["evaluation"]["seed_expansion_preserved"] for x in records)
          from collections import Counter
          counts=Counter(x["source"] for x in idx["records"])
          outcome_counts=Counter(x["evaluation"]["decision"] for x in records)
          summary={
              "schema":"reach-scout-decision-pipeline-metrics-v1",
              "scope":"Three negative controls plus one historical Crossref positive-control candidate; readiness means preflight, not staging",
              "source_fingerprint":idx["source_fingerprint"],
              "reach_public_records":counts["REACH"],
              "scout_published_candidate_rows":counts["SCOUT_PUBLISHED"],
              "scout_inbox_candidate_rows":counts["SCOUT_INBOX"],
              "test_cases_evaluated":len(records),
              "test_decisions":dict(sorted(outcome_counts.items())),
              "automatically_staged":sum(x["evaluation"]["automatically_staged"] for x in records),
              "private_hub_import":"NOT_VERIFIED",
              "reviewer_outcomes":"NOT_VERIFIED",
              "time_to_first_decision":"NOT_MEASURED"
          }
          destination=Path("scout-operations/identity-cache/decision-validation-summary.json")
          destination.write_text(json.dumps(summary,indent=2,sort_keys=True)+"\n")
          print("Validated three research holds and one positive-control draft-preflight recommendation; no auto-stage",summary)
          PY
            git add scout-operations/identity-cache/public-identity-index.json scout-operations/identity-cache/decision-validation-summary.json scout-operations/case-checkpoints
            if git diff --cached --quiet; then
              echo "Decision index and checkpoints already current"
              exit 0
            fi
            git commit -m "Refresh verified Scout identity index and DOI decision checkpoints"
            if git push origin HEAD:main; then
              echo "Published validated decision checkpoint revision"
              exit 0
            fi
            echo "Concurrent main update; regenerate from fresh source"
            sleep $((attempt * 2))
          done
          echo "::error::Unable to publish verified checkpoints after five attempts"
          exit 1
