name: REACH Scout GitHub code metadata checkpoint
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scout-operations/research-leads/**'
      - 'scout-operations/tools/audit_github_code_metadata.py'
      - '.github/workflows/scout-github-code-metadata-checkpoint.yml'
  schedule:
    - cron: '53 14 * * 1'
permissions:
  contents: write
concurrency:
  group: reach-scout-github-code-metadata-main
  cancel-in-progress: false
jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Query public GitHub repository, release and tag metadata
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scout-operations/tools/audit_github_code_metadata.py
      - name: Validate report
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('scout-operations/reports/github-code-metadata-checkpoint/latest.json').read_text())
          assert x['read_only'] is True
          assert x['record_count']==len(x['records'])
          assert len({r['output_url'] for r in x['records']})==len(x['records'])
          print('GitHub code metadata:',x['record_count'],'records,',x['successful'],'fully fetched')
          PY
      - name: Upload checkpoint artifact
        uses: actions/upload-artifact@v4
        with:
          name: scout-github-code-metadata
          path: scout-operations/reports/github-code-metadata-checkpoint/latest.json
          retention-days: 90
      - name: Commit read-only checkpoint report
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scout-operations/reports/github-code-metadata-checkpoint/latest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh Scout GitHub code metadata checkpoint'
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main
            sleep "$((attempt * 2))"
          done
          exit 1
