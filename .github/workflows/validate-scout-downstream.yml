name: Verify Scout downstream read-only boundary
on:
  pull_request:
    paths:
      - 'integrations/DiscoveryHubDownstreamVerification.gs'
      - 'integrations/test_downstream_verification.js'
      - 'integrations/test_privacy_boundaries.js'
      - 'integrations/DiscoveryHubScoutFeedback.gs'
      - 'integrations/REACH_PublicExportPrivacyGuard.gs'
      - 'integrations/test_public_export_privacy.js'
      - 'integrations/DiscoveryHubDownstreamVerificationInstall.md'
      - '.github/workflows/validate-scout-downstream.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Google Apps Script syntax check
        run: |
          cp integrations/DiscoveryHubDownstreamVerification.gs /tmp/DiscoveryHubDownstreamVerification.js
          node --check /tmp/DiscoveryHubDownstreamVerification.js
          cp integrations/REACH_PublicExportPrivacyGuard.gs /tmp/REACH_PublicExportPrivacyGuard.js
          node --check /tmp/REACH_PublicExportPrivacyGuard.js
      - name: Synthetic read-only downstream boundary tests
        run: node integrations/test_downstream_verification.js
      - name: Private review export and diagnostic log privacy tests
        run: node integrations/test_privacy_boundaries.js
      - name: Final public REACH export privacy tests
        run: node integrations/test_public_export_privacy.js
