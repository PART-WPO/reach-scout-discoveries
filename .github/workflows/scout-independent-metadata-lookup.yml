name: REACH Scout independent metadata lookup
on:
  workflow_dispatch:
    inputs:
      doi:
        description: Optional exact DOI
        required: false
        type: string
      github_url:
        description: Optional GitHub repository or release URL
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - 'scout-operations/research-leads/**'
      - 'scout-operations/tools/lookup_independent_metadata.py'
      - 'scout-operations/tools/lookup_independent_dois.py'
      - 'scout-operations/tools/research_memory.py'
      - 'scout-operations/tools/ir_reach_identity.py'
      - 'scout-operations/noaa-ir/manifest.json'
      - 'scout-operations/tools/preprint_watchlist.py'
      - 'scout-operations/tools/lookup_artifact_scope.py'
      - 'scout-operations/tools/audit_github_code_metadata.py'
      - '.github/workflows/scout-independent-metadata-lookup.yml'
permissions:
  contents: write
concurrency:
  group: scout-independent-metadata-main
  cancel-in-progress: false
jobs:
  lookup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Verify current public REACH manifest before identity screening
        run: |
          python3 - <<'PY'
          import hashlib,json,urllib.request
          from pathlib import Path
          cache=json.loads(Path("scout-operations/reach-comparison-cache/comparison-index.json").read_text())
          with urllib.request.urlopen("https://raw.githubusercontent.com/PART-WPO/reach-dashboard/main/agent-data/manifest.json",timeout=45) as response:
              live=hashlib.sha256(response.read()).hexdigest()
          if live!=cache["source_manifest_sha256"]:
              raise SystemExit("STALE PUBLIC REACH CACHE: refresh before independent identity screening")
          print("Verified live REACH source SHA",live)
          PY
      - name: Look up DOI registries and GitHub release metadata
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REQUESTED_DOI: ${{ inputs.doi || '' }}
          REQUESTED_GITHUB_URL: ${{ inputs.github_url || '' }}
        run: |
          set -euo pipefail
          ARGS=()
          if [[ -n "$REQUESTED_DOI" ]]; then ARGS+=(--doi "$REQUESTED_DOI"); fi
          if [[ -n "$REQUESTED_GITHUB_URL" ]]; then ARGS+=(--github-url "$REQUESTED_GITHUB_URL"); fi
          python3 scout-operations/tools/lookup_independent_metadata.py "${ARGS[@]}"
      - name: Register newly identified independent preprint DOIs without a recurring recheck
        run: python3 scout-operations/tools/preprint_watchlist.py --register-only
      - name: Validate unified report
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('scout-operations/reports/independent-metadata-lookup/latest.json').read_text())
          assert x['read_only']
          assert x['doi_count']==len(x['doi_records'])
          assert x['github_count']==len(x['github_records'])
          assert len({r['doi'] for r in x['doi_records']})==x['doi_count']
          assert len({r['output_url'] for r in x['github_records']})==x['github_count']
          assert all('artifact_scope' in r for r in x['doi_records'])
          assert all('artifact_scope' in r for r in x['github_records'])
          assert x['doi_metadata_memory_hits']+x['doi_metadata_network_attempts']==x['doi_count']
          assert all(r.get('metadata_observed_at') for r in x['doi_records'])
          from pathlib import Path
          memory=json.loads(Path('scout-operations/research-memory/doi-cache-index.json').read_text())
          assert memory['schema']=='reach-scout-public-doi-research-memory-v1'
          assert not memory['author_names_in_memory_index']
          assert memory['private_reviewer_state']=='NOT_VERIFIED'
          print('DOIs',x['doi_count'],'GitHub',x['github_count'],'artifact scope inventoried')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: scout-independent-metadata
          path: scout-operations/reports/independent-metadata-lookup/latest.json
          retention-days: 90
      - name: Publish read-only report
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scout-operations/reports/independent-metadata-lookup/latest.json scout-operations/research-memory/doi-cache-index.json scout-operations/preprint-watchlist.json scout-operations/preprint-publication-leads.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh Scout independent metadata lookup'
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main
            sleep "$((attempt * 2))"
          done
          exit 1
