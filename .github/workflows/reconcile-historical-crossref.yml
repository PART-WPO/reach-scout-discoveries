name: Reconcile historical Crossref Scout research and expansion coverage
on:
  push:
    branches: [main]
    paths:
      - 'api-discoveries/historical-crossref/manifest.json'
      - 'api-discoveries/historical-crossref/batches/*.csv'
      - 'scout-operations/historical-crossref-triage.json'
      - 'scout-operations/tools/reconcile_historical_crossref.py'
      - '.github/workflows/reconcile-historical-crossref.yml'
  schedule:
    - cron: '17 12 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: scout-historical-crossref-reconcile
  cancel-in-progress: false
jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Reconcile original and expansion evidence
        run: |
          set -euo pipefail
          if [ ! -f api-discoveries/historical-crossref/manifest.json ]; then
            echo 'Historical Crossref API harvest not published yet; skip safely'
            exit 0
          fi
          python3 -m unittest discover -v -s scout-operations/tests
          python3 scout-operations/tools/reconcile_historical_crossref.py
          python3 scout-operations/tools/select_workstream.py
      - name: Publish updated research coverage
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scout-operations/historical-crossref-coverage.json scout-operations/active-workstream.json 2>/dev/null || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh Crossref original and DOI-seeded research coverage'
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main
            sleep "$((attempt * 2))"
          done
          exit 1
