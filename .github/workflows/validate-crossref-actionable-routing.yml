name: Validate actionable Crossref dedup routing
on:
  pull_request:
    paths:
      - 'scout-operations/historical-crossref-screening/build_actionable_routing.py'
      - '.github/workflows/validate-crossref-actionable-routing.yml'
      - 'scout-operations/tools/bulk_reach_dedup.py'
      - 'scout-operations/tests/test_bulk_reach_dedup.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile and build routing report from verified checkpoints
        run: |
          python -m py_compile scout-operations/historical-crossref-screening/build_actionable_routing.py scout-operations/tools/bulk_reach_dedup.py
          python -m unittest discover -s scout-operations/tests -p 'test_bulk_reach_dedup.py' -v
          python scout-operations/historical-crossref-screening/build_actionable_routing.py
          python scout-operations/tools/build_operational_scorecard.py
      - name: Assert complete actionable coverage and preserved seed routing
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("scout-operations/historical-crossref-screening/actionable-routing.json")
          d=json.loads(p.read_text())
          assert d["total"] == 614, d["total"]
          assert sum(d["counts"].values()) == 614
          assert all(e["route"] for e in d["entries"])
          assert all(e["route"] == "SKIP_ORIGINAL_NEW_OUTPUT_RESEARCH_KEEP_EXPANSION_SEED" for e in d["entries"] if e["outcome"] == "CONFIRMED_IN_REACH")
          assert d["bulk_identity_screening"]["counts"]["VERIFIED_EXISTING_REACH"]==d["counts"]["CONFIRMED_IN_REACH"]
          assert d["counts"]["CONFIRMED_IN_REACH"]>1, "Bulk dedup must improve beyond original one confirmed"
          score=json.loads(Path("scout-operations/scout-operational-scorecard.json").read_text())
          assert score["reach_screening"]["confirmed_reach"]==d["counts"]["CONFIRMED_IN_REACH"]
          assert score["reach_screening"]["likely_reach_needs_bounded_check"]==d["counts"]["LIKELY_IN_REACH"]
          assert score["separate_doi_expansion"]["historical_crossref_completed_verified"]==0
          assert all(e["original_triage_modified"] is False and e["expansion_seed_preserved"] is True for e in d["entries"])
          assert d["counts"].get("NOT_FOUND_IN_REACH_INDEX", 0) > 0, "Zero-hit comparisons still blocked"
          # Reconcile known duplicate dispositions and existing Scout overlaps.
          ledger=json.loads(Path("scout-operations/historical-crossref-triage.json").read_text())
          by_doi={e["doi"]:e for e in d["entries"]}
          known=[e for e in ledger["entries"] if e["status"]=="already_in_reach"]
          assert len(known) >= 9, len(known)
          for e in known:
              key=e["identity"].removeprefix("doi:")
              assert key in by_doi, key
              assert by_doi[key]["outcome"] in ("CONFIRMED_IN_REACH","LIKELY_IN_REACH"), (key,by_doi[key]["outcome"])
          assert d["scout_overlap_flagged"] == 30, d["scout_overlap_flagged"]
          assert d["counts"].get("SCREENING_INCOMPLETE",0)==0, d["counts"]
          print(d["counts"])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: crossref-actionable-routing-preview
          path: scout-operations/historical-crossref-screening/actionable-routing.json
