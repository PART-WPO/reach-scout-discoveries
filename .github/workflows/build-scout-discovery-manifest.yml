name: Validate and Publish Scout Discovery Feed

on:
  push:
    branches: [main]
    paths:
      - 'scout-discoveries/batches/*.csv'
      - 'scout-discoveries/tools/build_manifest.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scout-discovery-manifest-main
  cancel-in-progress: false

jobs:
  validate-and-refresh-manifest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Scout staging repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Validate all public CSV batches and generate manifest
        run: python scout-discoveries/tools/build_manifest.py

      - name: Commit validated manifest when changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- scout-discoveries/manifest.json
          if git diff --cached --quiet; then
            echo 'Scout discovery manifest is up to date.'
          else
            git commit -m 'Update verified Scout discovery manifest'
            git push
          fi
