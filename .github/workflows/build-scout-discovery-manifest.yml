name: Validate and Publish Scout Discovery Feed

on:
  push:
    branches: [main]
    paths:
      - 'scout-discoveries/inbox/*.csv'
      - 'scout-discoveries/batches/*.csv'
      - 'scout-discoveries/supersessions.json'
      - 'scout-discoveries/tools/build_manifest.py'
      - 'scout-discoveries/tools/prepare_batch.py'
      - 'scout-operations/tools/verify_preprint_intake.py'
      - 'scout-operations/tests/test_universal_preprint_gate.py'
      - 'scout-operations/tools/reconcile_monthly_staging.py'
      - 'scout-discoveries/tools/promote_inbox.py'
      - 'scout-discoveries/tools/rebuild_discovery_rollup.py'
      - 'scout-operations/legacy-provenance-backfill.json'
      - 'scout-operations/method-recovery-followups.json'
      - 'scout-discoveries/tools/tests/**'
      - '.github/workflows/build-scout-discovery-manifest.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scout-discovery-manifest-main
  cancel-in-progress: false

jobs:
  validate-and-refresh-manifest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Scout staging repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Test fixed-schema candidate generator and provenance safeguards
        run: python -m unittest discover -s scout-discoveries/tools/tests -v

      - name: Verify actual Crossref/DataCite publication status for every new batch
        run: |
          python3 -m unittest discover -s scout-operations/tests -p test_universal_preprint_gate.py -v
          python3 scout-operations/tools/verify_preprint_intake.py
      - name: Preflight and promote only validated new inbox drafts
        env:
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          SCOUT_PREPRINT_GATE_REQUIRED: '1'
        run: |
          if [ "$EVENT_NAME" = "push" ]; then
            python scout-discoveries/tools/promote_inbox.py --before "$PUSH_BEFORE" --after "$PUSH_AFTER"
          else
            python scout-discoveries/tools/promote_inbox.py
          fi

      - name: Validate all published batch CSVs and generate authorized manifest
        env:
          SCOUT_PREPRINT_GATE_REQUIRED: '1'
        run: python scout-discoveries/tools/build_manifest.py

      - name: Reconcile attribution metrics from all exact SHA-verified CSV batches
        run: python scout-discoveries/tools/rebuild_discovery_rollup.py

      - name: Record validated monthly Scout proposals without assuming private Hub import
        run: |
          python scout-operations/tools/reconcile_monthly_staging.py
          python scout-operations/tools/build_coverage.py
          python scout-operations/tools/build_monthly_decision_queue.py
          python scout-operations/tools/select_workstream.py

      - name: Atomically commit promoted CSVs, manifest and reconciled origin metrics
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- scout-operations/preprint-intake-gate.json scout-operations/preprint-watchlist.json scout-discoveries/batches/ scout-discoveries/manifest.json scout-operations/discovery-origin-rollup.json scout-operations/monthly-triage.json scout-operations/coverage.json scout-operations/monthly-decision-queue.json scout-operations/active-workstream.json
          if git diff --cached --quiet; then
            echo 'Validated Scout feed and attribution metrics are up to date.'
          else
            git commit -m 'Publish validated Scout discovery feed and reconciled attribution metrics'
            for attempt in 1 2 3 4 5; do
              if git push origin HEAD:main; then exit 0; fi
              git fetch origin main
              git rebase origin/main
              sleep "$((attempt * 2))"
            done
            exit 1
          fi
