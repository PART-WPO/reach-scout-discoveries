name: REACH Scout first-of-month preprint watchlist
on:
  push:
    branches: [main]
    paths:
      - 'scout-operations/tools/preprint_watchlist.py'
      - 'scout-operations/tools/reconcile_preprint_retirements.py'
      - 'scout-operations/tests/test_preprint_retirements.py'
      - 'scout-operations/tools/lookup_independent_dois.py'
      - 'scout-operations/tests/test_preprint_watchlist.py'
      - '.github/workflows/scout-preprint-watchlist.yml'
  schedule:
    - cron: '45 0 1 * *'
      timezone: "America/New_York"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: scout-preprint-watchlist
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Verify preprint status logic
        run: python3 -m unittest discover -s scout-operations/tests -p test_preprint_watchlist.py -v
      - name: Verify preprint retirement safeguards
        run: python3 -m unittest discover -s scout-operations/tests -p test_preprint_retirements.py -v
      - name: Recheck preprint DOIs and publish from latest main with safe retries
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git checkout -B main origin/main
            python3 scout-operations/tools/preprint_watchlist.py
            git add scout-operations/preprint-watchlist.json scout-operations/preprint-publication-leads.json scout-operations/preprint-retirement-archive.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Refresh monthly Scout preprint Watchlist and retire confirmed REACH families'
            if git push origin HEAD:main; then exit 0; fi
            sleep "$((attempt * 2))"
          done
          exit 1
