name: Scout cross-lane research memory and expansion checkpoint
on:
  pull_request:
    paths:
      - 'scout-operations/tools/build_crosslane_research_memory.py'
      - 'scout-operations/tests/test_crosslane_research_memory.py'
      - 'scout-operations/tests/test_independent_hourly_recovery.py'
      - 'scout-operations/tools/select_independent_mission_candidates.py'
      - 'scout-operations/tools/recover_historical_datacite.py'
      - 'scout-operations/tools/lookup_independent_dois.py'
      - 'scout-operations/tools/lookup_independent_metadata.py'
      - '.github/workflows/scout-crosslane-research-memory.yml'
  push:
    branches: [main]
    paths:
      - 'scout-operations/tools/build_crosslane_research_memory.py'
      - 'scout-operations/research-outcome-registry.json'
      - 'scout-operations/unified-source-preflight.json'
      - 'scout-operations/monthly-expansion-leads.json'
      - 'scout-operations/independent-discovery-leads.json'
      - 'scout-operations/research-leads/**'
      - 'scout-operations/historical-crossref-phase2/*.json'
      - 'scout-operations/monthly-research/*.json'
      - 'scout-operations/historical-crossref-screening/actionable-routing.json'
      - 'api-discoveries/historical/manifest.json'
      - 'scout-operations/historical-coverage.json'
      - 'scout-operations/historical-triage.json'
      - 'scout-operations/historical-reconciliation-exceptions.json'
      - 'scout-discoveries/manifest.json'
      - 'api-discoveries/historical-crossref/manifest.json'
      - 'scout-operations/reports/doi-metadata-checkpoint/latest.json'
      - '.github/workflows/scout-crosslane-research-memory.yml'
  workflow_run:
    workflows:
      - 'Scout unified discovery preflight'
      - 'Scout all-lane research outcome registry'
      - 'Historical Crossref actionable routing'
      - 'REACH Scout direct DOI metadata checkpoint'
    branches: [main]
    types: [completed]
  schedule:
    - cron: '35 11 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: scout-crosslane-research-memory-main
  cancel-in-progress: false
jobs:
  index:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile and validate source-verified graph, expansion safety and source freshness
        run: |
          set -euo pipefail
          python -m py_compile scout-operations/tools/build_crosslane_research_memory.py
          python -m py_compile scout-operations/tools/recover_historical_datacite.py scout-operations/tools/select_independent_mission_candidates.py scout-operations/tools/lookup_independent_dois.py scout-operations/tools/lookup_independent_metadata.py
          python -m unittest discover -s scout-operations/tests -p 'test_independent_hourly_recovery.py' -v
          python -m unittest discover -s scout-operations/tests -p 'test_crosslane_research_memory.py' -v
          python -m unittest discover -s scout-operations/tests -p 'test_unified_source_preflight.py' -v
          python -m unittest discover -s scout-operations/tests -p 'test_research_outcome_registry.py' -v
      - name: Build graph and verify deterministic second pass
        run: |
          set -euo pipefail
          python scout-operations/tools/build_crosslane_research_memory.py
          python scout-operations/tools/build_crosslane_research_memory.py --check
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('scout-operations/research-memory/crosslane-relationship-graph.json')
          m=json.loads(p.read_text())
          assert m['schema']=='reach-scout-crosslane-research-memory-v1'
          assert m['preflighted_lane_doi_records'] >= 827
          assert m['verified_reach_originals_preserved_as_expansion_seeds'] >= 426
          assert m['explicit_related_output_links'] > 0
          assert m['human_reviewer_decisions_changed']==m['new_reach_publications']==0
          assert m['originals_closed_by_memory']==m['expansions_closed_by_memory']==0
          assert m['hub_records_automatically_staged']==0
          assert not m['public_author_names_or_spark_personnel_indexed']
          assert all(not x['complete'] for x in m['work_items'])
          p2=Path('scout-operations/research-memory/mission-index.json')
          small=json.loads(p2.read_text())
          assert small['source_fingerprint']==m['source_fingerprint']
          assert small['builder_policy_sha256']==m['builder_policy_sha256']
          assert small['group_counts_before_preview_bound']['monthly_original']>=0
          historical=json.loads(Path('scout-operations/historical-coverage.json').read_text())
          exceptions=json.loads(Path('scout-operations/historical-reconciliation-exceptions.json').read_text())
          exception_dois={e['identity'].removeprefix('doi:').lower() for e in exceptions['exceptions']}
          assert small['group_counts_before_preview_bound']['historical_reconciliation_needed']==len(exception_dois)
          assert not exception_dois & {e['doi'] for e in
                small['recommended_preview']['historical_datacite_original']}
          assert small['group_counts_before_preview_bound']['historical_datacite_original']<=historical['remaining']-len(exception_dois)
          assert not any(x['doi']=='10.13012/b2idb-0704763_v1' for x in
                         small['recommended_preview']['historical_datacite_original'])
          assert small['group_counts_before_preview_bound']['existing_public_original_disposition']>0
          assert sum(x['track']=='EXPANSION' and x['doi']=='10.13012/b2idb-0704763_v1' for x in m['work_items'])==1
          assert small['group_counts_before_preview_bound']['monthly_existing_public_disposition']>=0
          assert small['group_counts_before_preview_bound']['existing_public_related_or_staged']>=0
          assert all(not c['automatically_completed_or_staged'] for c in
                     small['recommended_preview']['monthly_existing_public_disposition'])
          assert small['verified_reach_expansion_total_preserved']==m['verified_reach_originals_preserved_as_expansion_seeds']
          assert small['group_counts_before_preview_bound']['verified_reach_expansion']==m['verified_reach_originals_preserved_as_expansion_seeds']
          assert all(len(group)<=small['max_preview_per_group'] for group in small['recommended_preview'].values())
          assert p2.stat().st_size<100000
          assert not small['reviewer_approval_or_publication_inferred']
          print(json.dumps({
              'source_verified_cases':m['preflighted_lane_doi_records'],
              'expansion_seeds_preserved':m['verified_reach_originals_preserved_as_expansion_seeds'],
              'explicit_related_links':m['explicit_related_output_links'],
              'prior_research_notes_reused':m['historical_note_events_reused_as_context'],
              'new_review_or_reach_additions':0,
          },sort_keys=True))
          PY
      - name: Publish only graph memory from freshly verified main sources
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5; do
            git reset --hard HEAD
            git fetch origin main
            git checkout -B main origin/main
            python scout-operations/tools/build_crosslane_research_memory.py
            python scout-operations/tools/build_crosslane_research_memory.py --check
            git add scout-operations/research-memory/crosslane-relationship-graph.json scout-operations/research-memory/mission-index.json
            if git diff --cached --quiet; then
              echo 'Research relationship graph already current'
              exit 0
            fi
            git commit -m 'Refresh source-SHA-verified cross-lane research memory and distinct expansion'
            if git push origin HEAD:main; then exit 0; fi
            sleep "$((attempt * 2))"
          done
          exit 1
      - name: Upload reproducible public-only research graph
        uses: actions/upload-artifact@v4
        with:
          name: scout-crosslane-research-graph
          path: |
            scout-operations/research-memory/crosslane-relationship-graph.json
            scout-operations/research-memory/mission-index.json
          retention-days: 14
          if-no-files-found: error
