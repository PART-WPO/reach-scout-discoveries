name: Verify Scout API-to-historical workstream switching
on:
  pull_request:
    paths:
      - '.github/workflows/select-scout-workstream.yml'
  push:
    branches: [main]
    paths:
      - 'scout-operations/tools/select_workstream.py'
      - 'scout-operations/tests/test_select_workstream.py'
      - 'scout-operations/coverage.json'
      - 'scout-operations/historical-coverage.json'
      - 'scout-operations/monthly-triage.json'
      - 'scout-operations/monthly-expansion-leads.json'
      - 'scout-operations/monthly-decision-queue.json'
      - 'scout-operations/historical-triage.json'
      - 'scout-operations/metadata-blockers.json'
      - 'scout-operations/attribution-followups.json'
      - 'api-discoveries/manifest.json'
      - 'api-discoveries/historical/manifest.json'
      - 'api-discoveries/historical-crossref/manifest.json'
      - 'scout-operations/historical-crossref-triage.json'
      - 'scout-operations/historical-crossref-coverage.json'
      - '.github/workflows/select-scout-workstream.yml'
  schedule:
    - cron: '31 12 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: scout-select-workstream
  cancel-in-progress: false
jobs:
  route:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Test monthly and historical first-pass, follow-up and human-handoff priority
        run: |
          python3 -m unittest discover -v -s scout-operations/tests
      - name: Check selector on current checkout (no write)
        run: python3 scout-operations/tools/select_workstream.py
      - name: Publish fresh, source-reconciled selector (main only)
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5; do
            echo "Fresh workstream selection attempt ${attempt}/5"
            # Rebuild from latest remote state on EVERY attempt. Do not rebase
            # stale generated JSON into a newer routing or relevance snapshot.
            git fetch origin main
            git checkout -B main origin/main
            python3 scout-operations/tools/select_workstream.py
            git add scout-operations/active-workstream.json
            if git diff --cached --quiet; then
              echo "Live workstream is already current"
              exit 0
            fi
            git commit -m 'Select Scout workstream from current API and relevance sources'
            if git push origin HEAD:main; then
              echo "Published verified workstream at $(git rev-parse HEAD)"
              exit 0
            fi
            echo "::warning::Concurrent data update; rerunning against latest source SHA"
            sleep "$((attempt * 2))"
          done
          echo "::error::Failed to publish a fresh workstream after bounded retries"
          exit 1
